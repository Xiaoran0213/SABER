project:
  name: brunner_impute_missingon
  outdir: outputs/brunner_impute_missingon
  seed: 42
data:
  synthetic: false
  path: ${SABER_DATA_ROOT}/brunner2022/prepared/Brunner2022.h5ad
  protein_features_path: ${SABER_DATA_ROOT}/brunner2022/prepared/Brunner2022_features.npz
  batch_key: batch
  cell_type_key: cell_type
  scale_mode: zscore
  allow_random_protein_features: false
missing:
  enabled: true
model:
  latent_dim: 16
  ae_h1: 128
  ae_h2: 64
  protein_feature_dim: 1280
  protein_proj_dim: 256
  protein_proj_hidden_dim: 256
  protein_proj_dropout: 0.10
  bilinear_with_w: true
  trainable_protein_features: false
training:
  epochs: 300
  batch_size: 32
  lr: 0.0005
  weight_decay: 0.01
  val_frac: 0.05
  device: auto
  lr_mult_protein_features: 1.0
  lr_mult_protein_encoder: 1.0
evaluation:
  imputation: true
